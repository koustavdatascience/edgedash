target_role: Data Analyst
target_city: Remote
target_seniority: mid
score_batch_size: 25
score_weights:
  skill_match: 0.45
  seniority_fit: 0.25
  location_fit: 0.15
  recency: 0.15

keywords:
  - data analyst
  - SQL
  - Python
  - Excel
  - Tableau
  - Power BI
  - dashboards
  - reporting

my_skills:
  - SQL
  - Python
  - Excel
  - data cleaning
  - pandas
  - Tableau
  - data visualization
  - stakeholder communication

experience_years: 3
db_path: data/edgedash.db
db_backend: sqlite
min_fit_score: 60

sources:
  - arbeitnow

use_mock_fetcher: false

# LLM Configuration (can also be set via environment variables)
llm_provider: gemini
llm_model: gemini-3.5-flash

# Scheduler Configuration
# Options: hourly, daily, daily_6am, weekly, or custom like "every_30_minutes", "every_2_hours"
schedule_interval: daily_6am

# Orchestration thresholds — Orchestrator uses these, agents never set their own limits (rule 29)
fetch_interval_hours: 6      # re-fetch if last fetch was this many hours ago
fetch_max_pages: 5            # stop fetcher after this many pages per source
fetch_max_listings: 200       # stop fetcher after this many new listings
score_max_seconds: 300        # stop scorer after this many seconds
analyse_max_seconds: 60       # stop gap analyser after this many seconds
verifier_max_seconds: 60      # stop verifier after this many seconds

# Verification thresholds (rule 39) — every threshold has a comment naming
# the failure mode it is designed to catch.
# Thresholds live here, never hardcoded in verification.py.
min_score_spread: 10          # catches uniform score inflation: all scores too close together
min_score_stdev: 5            # catches tight clustering even when spread looks OK
max_empty_extraction_pct: 20  # catches a broken extractor returning no skills
max_skills_per_listing: 20    # catches a model that returned a whole sentence as a skill list
min_gap_sample: 3             # catches ranking a gap rumour computed from 1-2 listings
max_data_age_days: 3          # catches a silent fetch failure leaving stale data in the pipeline

# Skill alias map — THIS IS YOURS TO EDIT.
# Adding entries is expected as you see your own data.
# Run `python -m edgedash.skills --audit` to find aliases you are missing.
# Format: raw (lowercase) -> canonical form
skill_aliases:
  k8s: kubernetes
  postgres: postgres
  postgresql: postgres
  psql: postgres
  node: node.js
  nodejs: node.js
  gcp: gcp
  google cloud: gcp
  google cloud platform: gcp
  ml: machine learning
  ci/cd: ci/cd
  ci cd: ci/cd
  cicd: ci/cd
  ms excel: excel
  microsoft excel: excel
  ms sql: sql server
  microsoft sql server: sql server
  mssql: sql server
  power bi: power bi
  powerbi: power bi
  pbi: power bi
  tableau desktop: tableau
  r programming: r
  py: python
  looker studio: looker
  google looker: looker
  aws s3: s3
